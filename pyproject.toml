[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-defense"
version = "0.1.0"
description = "APEX active defense for tool-using agents"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40",
  "openai-agents>=0.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = [
  "apex",
  "apex.core",
  "apex.defender",
  "apex.defender.contract",
]
package-dir = { apex = "src/apex" }
include-package-data = true

[tool.setuptools.package-data]
"apex.defender" = ["skills/**/*.md", "skills/**/*.yaml"]
